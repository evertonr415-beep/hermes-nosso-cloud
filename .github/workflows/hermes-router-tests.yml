name: Hermes Router Offline Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-router-tests.yml"
      - "hermes-global-model-router.py"
      - "tests/test_vector_rest.py"
      - "hermes-groq-catalog-monitor.py"
      - "tests/test_groq_catalog_monitor.py"
      - "hermes-render-light-web.py"
      - "hermes-simple.py"
      - "tests/test_hf_router_retry.py"
      - "tests/test_public_anon_router.py"
      - "tests/test_groq_free_router.py tests/test_vector_rest.py"
      - "hermes-light-agent.py"
      - "hermes-memory-sync.py"
      - "tests/test_memory_sync.py"
      - "tests/test_memory_recovery.py"
      - "hermes-memory-recovery.py"
      - "tests/test_light_agent.py"
      - "tests/test_advanced_ui.py"
      - "hermes-simple.py"
      - "Dockerfile"
      - "hermes-infra-audit.py"
      - "tests/test_infra_audit.py"
      - "tests/test_memory_chat.py"
      - "tests/test_memory_ranking.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax (no API keys needed)
        run: |
          python -m py_compile hermes-global-model-router.py hermes-render-light-web.py hermes-simple.py hermes-light-agent.py tests/test_light_agent.py tests/test_advanced_ui.py hermes-memory-sync.py tests/test_memory_sync.py hermes-memory-recovery.py tests/test_memory_recovery.py tests/test_hf_router_retry.py tests/test_public_anon_router.py tests/test_groq_free_router.py hermes-infra-audit.py tests/test_infra_audit.py
      - name: Run offline inference-router regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*router*.py' -v

      - name: Install offline cryptography dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify Groq model catalogue monitor
        run: python -m unittest discover -s tests -p test_groq_catalog_monitor.py -v
      - name: Check vector REST authorization offline
        run: python -m unittest discover -s tests -p test_vector_rest.py -v
      - name: Test encrypted memory sync (offline)
        run: python -m unittest discover -s tests -p 'test_memory_sync.py' -v
      - name: Test authenticated memory restoration offline
        run: python -m unittest discover -s tests -p 'test_memory_recovery.py' -v
      - name: Test bounded infrastructure audit
        run: python -m unittest discover -s tests -p test_infra_audit.py -v
      - name: Test read-only advanced agent
        run: |
          python -m unittest discover -s tests -p 'test_light_agent.py' -v
      - name: Check memory consent
        run: python -m unittest discover -s tests -p test_memory_chat.py -v
      - name: Check Advanced sidebar and browser JavaScript
        run: |
          python -m unittest discover -s tests -p 'test_advanced_ui.py' -v
