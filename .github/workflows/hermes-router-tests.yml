name: Hermes Router Offline Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-router-tests.yml"
      - "hermes-global-model-router.py"
      - "tests/test_vector_rest.py"
      - "hermes-groq-catalog-monitor.py"
      - "tests/test_groq_catalog_monitor.py"
      - "hermes-render-light-web.py"
      - "hermes-simple.py"
      - "tests/test_hf_router_retry.py"
      - "tests/test_public_anon_router.py"
      - "tests/test_groq_free_router.py"
      - "tests/test_vector_rest.py"
      - "hermes-light-agent.py"
      - "hermes-memory-sync.py"
      - "tests/test_memory_sync.py"
      - "tests/test_memory_recovery.py"
      - "hermes-memory-recovery.py"
      - "tests/test_light_agent.py"
      - "tests/test_advanced_ui.py"
      - "hermes-simple.py"
      - "Dockerfile"
      - "hermes-infra-audit.py"
      - "tests/test_infra_audit.py"
      - "tests/test_memory_chat.py"
      - "tests/test_memory_ranking.py"
      - "hermes-image-studio.py"
      - "hermes-image-worker/app.py"
      - "tests/test_image_studio.py"
      - "agent-browser-worker/**"
      - "tests/test_agent_browser_worker.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax (no API keys needed)
        run: |
          python -m py_compile hermes-global-model-router.py hermes-render-light-web.py hermes-simple.py hermes-light-agent.py tests/test_light_agent.py tests/test_advanced_ui.py hermes-memory-sync.py tests/test_memory_sync.py hermes-memory-recovery.py hermes-memory-write.py tests/test_memory_write.py tests/test_memory_recovery.py tests/test_hf_router_retry.py tests/test_public_anon_router.py tests/test_groq_free_router.py hermes-infra-audit.py tests/test_infra_audit.py hermes-image-studio.py tests/test_image_studio.py tests/test_agent_browser_worker.py agent-browser-worker/server.py hermes-image-worker/app.py
      - name: Run offline inference-router regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*router*.py' -v

      - name: Install offline cryptography dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Verify Groq model catalogue monitor
        run: python -m unittest discover -s tests -p test_groq_catalog_monitor.py -v
      - name: Check vector REST authorization offline
        run: python -m unittest discover -s tests -p test_vector_rest.py -v
      - name: Test encrypted memory sync (offline)
        run: python -m unittest discover -s tests -p 'test_memory_sync.py' -v
      - name: Test authenticated memory restoration offline
        run: python -m unittest discover -s tests -p 'test_memory_recovery.py' -v
      - name: Test bounded infrastructure audit
        run: python -m unittest discover -s tests -p test_infra_audit.py -v
      - name: Test read-only advanced agent
        run: |
          python -m unittest discover -s tests -p 'test_light_agent.py' -v
      - name: Check memory consent
        run: python -m unittest discover -s tests -p test_memory_chat.py -v
      - name: Check explicit persistent memory writes
        run: python -m unittest discover -s tests -p test_memory_write.py -v
      - name: Prepare memory modules for UI integration test
        run: |
          sudo install -m 0644 hermes-memory-recovery.py /usr/local/bin/hermes-memory-recovery
          sudo install -m 0644 hermes-memory-write.py /usr/local/bin/hermes-memory-write
      - name: Check Advanced sidebar and browser JavaScript
        run: |
          python -m unittest discover -s tests -p 'test_advanced_ui.py' -v
      - name: Test zero-cost image studio adapter (offline)
        run: python -m unittest discover -s tests -p 'test_image_studio.py' -v

      - name: Test isolated agent-browser worker (offline)
        run: python -m unittest discover -s tests -p 'test_agent_browser_worker.py' -v

  browser-worker-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated agent-browser image
        run: docker build -f agent-browser-worker/Dockerfile -t hermes-agent-browser-worker:test agent-browser-worker
      - name: Smoke-test authenticated read-only browser in container
        shell: bash
        run: |
          set -euo pipefail
          token="ci-test-token-0123456789abcdef012345"
          docker run -d --rm --name hermes-browser-worker-smoke \
            -p 127.0.0.1:18080:8080 \
            -e BROWSER_WORKER_TOKEN="$token" \
            -e AGENT_BROWSER_ALLOWED_DOMAINS=example.com \
            hermes-agent-browser-worker:test
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Browser worker logs (diagnostic, no request payloads expected):"
              docker logs hermes-browser-worker-smoke 2>&1 || true
              echo "Browser worker container state:"
              docker inspect hermes-browser-worker-smoke --format '{{json .State}}' 2>/dev/null || true
            fi
            docker rm -f hermes-browser-worker-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/browser-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          grep -q 'isolated-browser-worker' /tmp/browser-health.json
          unauthorized=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/read \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}')
          test "$unauthorized" = "401"
          read_status=$(curl -sS -o /tmp/browser-response.json -w '%{http_code}' \
            --max-time 25 -X POST http://127.0.0.1:18080/read \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com"}')
          echo "Authenticated read HTTP status: $read_status"
          test "$read_status" = "200"
          grep -q 'This domain is for use in documentation examples' /tmp/browser-response.json
          blocked=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/read \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.org"}')
          test "$blocked" = "400"
