name: Hermes Router Offline Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-router-tests.yml"
      - "hermes-global-model-router.py"
      - "hermes-render-light-web.py"
      - "hermes-simple.py"
      - "tests/test_hf_router_retry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax (no API keys needed)
        run: |
          python -m py_compile hermes-global-model-router.py hermes-render-light-web.py hermes-simple.py tests/test_hf_router_retry.py
      - name: Run offline inference-router regression tests
        run: |
          python -m unittest discover -s tests -p 'test_hf_router_retry.py' -v
