services:
  hermes-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: 9119
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
    volumes:
      - hermes-data:/opt/data
    ports:
      - "9119:9119"
    restart: unless-stopped

  hermes-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    env_file: .env
    environment:
      PORT: 9120
      BRIDGE_PORT: 9120
      HERMES_UPSTREAM: http://hermes-cloud:8642
    depends_on:
      - hermes-cloud
    ports:
      - "9120:9120"
    restart: unless-stopped

  hermes-web:
    build:
      context: .
      dockerfile: Dockerfile.simple
    env_file: .env
    environment:
      PORT: 9119
      HERMES_SIMPLE_BRIDGE_UPSTREAM: http://hermes-bridge:9120
      HERMES_ADVANCED_URL: http://localhost:9119
    depends_on:
      - hermes-bridge
    ports:
      - "9121:9119"
    restart: unless-stopped

  tailscale-gateway:
    profiles: ["local-agent"]
    build:
      context: .
      dockerfile: Dockerfile.tailscale-gateway
    env_file: .env
    environment:
      PORT: 8642
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped

volumes:
  hermes-data:
  tailscale-state:
